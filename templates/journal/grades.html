{% extends 'base.html' %}
{% block content %}
<h1>Журнал оценок</h1>
<form method="get" class="search">
    <select name="group">
        <option value="">Все группы</option>
        {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
    </select>
    <button type="submit">Фильтр</button>
</form>
<table>
    <tr><th>Дата</th><th>Студент</th><th>Предмет</th><th>Оценка</th></tr>
    {% for g in page_obj %}
    <tr><td>{{ g.date|date:"d.m.Y" }}</td><td>{{ g.student.full_name }}</td><td>{{ g.subject.name }}</td><td><b class="b{{ g.value }}">{{ g.value }}</b></td></tr>
    {% empty %}<tr><td colspan="4">Оценок нет.</td></tr>{% endfor %}
</table>
{% endblock %}
