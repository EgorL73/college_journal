{% extends 'base.html' %}
{% block content %}
<h1>Студенты</h1>
<form method="get" class="search">
    <input type="text" name="q" id="search-input" value="{{ q }}" placeholder="Быстрый поиск (fetch)...">
    <button type="submit">Найти (старый)</button>
</form>

<div id="fetch-results" style="margin-bottom: 20px; font-weight: bold; color: #3498db;"></div>

{% if page_obj.object_list %}
<table id="students-table">
    <tr><th>ФИО</th><th>Группа</th><th>Зачётка</th></tr>
    {% for s in page_obj %}
    <tr><td><a href="{% url 'journal:student' s.pk %}">{{ s.full_name }}</a></td><td>{{ s.group.name }}</td><td>{{ s.record_book }}</td></tr>
    {% endfor %}
</table>
{% else %}<p>Студентов нет.</p>{% endif %}
{% endblock %}
